name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GAMETAGGER_RUN_LIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen --extra dev --python 3.11
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv build
  website:
    runs-on: ubuntu-latest
    env:
      GAMETAGGER_RUN_LIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --frozen --extra dev --python 3.11
      - run: npm ci
        working-directory: frontend
      - run: uv run --frozen python scripts/export_workspace_schema.py
      - run: npm run types && npx prettier --write src/api-schema.d.ts
        working-directory: frontend
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api-schema.d.ts
      - run: npm run lint && npm test && npm run build
        working-directory: frontend
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
