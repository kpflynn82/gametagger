# Old GenomeTagger boolean tag keys (gametagger-web tagger.py VGMS_CATEGORIES, as the prompt
# names them) -> rich-mode Genome tags (taxonomy/vgms_v4.yaml pilot tags + genome_tags_v1.yaml).
#
# STATUS: draft, pending owner approval.
#
# relation:
#   exact  same attribute
#   close  overlapping attribute; reported separately from exact matches
#   none   no Genome tag means the same
# A key the old method did not return is unknown, never false. Keys the model invents outside
# this list (for example gameplay_fps) are kept in the raw result and counted as unmapped.
version: legacy-tags-to-genome-draft-1
status: draft-pending-owner-approval
