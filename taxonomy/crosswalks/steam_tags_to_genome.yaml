# Steam user tags (exact Steam spellings) -> rich-mode Genome tags and v4.1 genres.
#
# STATUS: draft, pending owner approval.
#
# Used only for the answer key: a Steam user tag among a game's most-voted tags is evidence that
# the mapped Genome tags are present. Only tags that clearly imply an attribute are mapped; vague
# or taste-based tags are listed under `unmapped` so the choice is visible. A Steam tag's absence
# never marks anything absent. `genres` lists v4 genres the tag is consistent with; it is a weak
# signal about the primary genre, reported separately and never as accuracy.
version: steam-tags-to-genome-draft-1
status: draft-pending-owner-approval
