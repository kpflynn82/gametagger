[project]
name = "gametagger"
version = "0.1.0"
description = "Evidence-backed, probabilistic video game genome classification"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typesafe-sdk==0.7.0",
  "anthropic>=1.7,<2",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.12",
]

[project.scripts]
gametagger = "gametagger.cli:main"
gametagger-eval = "gametagger.evaluation.runner:main"
gametagger-genome = "gametagger.genome.cli:main"
gametagger-compare = "gametagger.comparison.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gametagger"]

[tool.hatch.build.targets.wheel.force-include]
"taxonomy/vgms_v4.yaml" = "gametagger/data/vgms_v4.yaml"
"taxonomy/genome_tags_v1.yaml" = "gametagger/data/genome_tags_v1.yaml"
"taxonomy/crosswalks" = "gametagger/data/crosswalks"

[tool.pytest.ini_options]
markers = ["live: calls the authenticated Jev service when TYPESAFE_API_KEY exists"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
