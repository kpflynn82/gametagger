[project]
name = "genometagger-v2"
version = "0.1.0"
description = "Evidence-backed, probabilistic video game genome classification"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typesafe-sdk",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.12",
]

[project.scripts]
genometagger-eval = "genometagger_v2.evaluation.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genometagger_v2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
